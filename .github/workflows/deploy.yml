# Автодеплой теми на хостинг при кожному push у main.
# Дані доступу — у GitHub: Settings → Secrets and variables → Actions:
#   FTP_SERVER   — ftp.bti-ocinka.com.ua (або IP сервера)
#   FTP_USERNAME — FTP-акаунт, обмежений папкою теми
#   FTP_PASSWORD — пароль цього FTP-акаунта
name: Deploy theme

on:
  push:
    branches: [main]
    paths: ['bti-ocinka/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload theme via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./bti-ocinka/
          server-dir: ./
          exclude: |
            **/.git/**
            **/.github/**
            **/.DS_Store
